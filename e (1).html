<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0f6e56">
<title>Mi turno</title>
<style>
:root{--bg:#f5f6f2;--s:#fff;--fg:#17231f;--mu:#5d6b65;--ln:#dfe4dd;--ac:#0f6e56;--wk:#e1f5ee;--wkf:#085041;--li:#faeeda;--lif:#633806;--va:#fcebeb;--vaf:#791f1f;--ba:#fbeaf0;--baf:#72243e}
@media(prefers-color-scheme:dark){:root{--bg:#101714;--s:#17211d;--fg:#e8efe9;--mu:#9aa8a1;--ln:#2a3832;--ac:#3ec59d;--wk:#123a30;--wkf:#9be7cf;--li:#44300f;--lif:#f3c985;--va:#471c1c;--vaf:#f4aaaa;--ba:#47202f;--baf:#f2b0c6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.w{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.5rem;margin:0}h2{font-size:1rem;margin:0 0 8px}.mu{color:var(--mu);font-size:.85rem}
.c{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.d{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.d:last-child{border:0}
.d.hoy{font-weight:700}.t{padding:4px 10px;border-radius:99px;font-size:.88rem;font-weight:600;text-align:right;white-space:pre-line}
.trab{background:var(--wk);color:var(--wkf)}.libre{background:var(--li);color:var(--lif)}.vac{background:var(--va);color:var(--vaf)}.baja{background:var(--ba);color:var(--baf)}.nada{color:var(--mu)}
label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mu)}
input,select,textarea,button{font:inherit;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);padding:10px;min-height:44px;width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ok{color:var(--wkf)}.er{color:var(--vaf)}
</style></head><body><div class="w" id="app"><div class="mu">Cargando…</div></div>
<script>
const SB='https://gxkxslkdqgwovgxcuzkr.supabase.co',AK='sb_publishable_xAUprOgWQi0HhYms69zUhA_yiTwDYPK',DL=['dom','lun','mar','mié','jue','vie','sáb'],ML=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const tok=new URLSearchParams(location.search).get('t')||'';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const rpc=(f,b)=>fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:AK,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const cls=t=>{const u=(t||'').toUpperCase();return!t?'nada':u.includes('LIBRE')?'libre':u.includes('VACACIONES')?'vac':u.includes('BAJA')?'baja':'trab'};
const fd=s=>{const d=new Date(s+'T00:00');return d.getDate()+' '+ML[d.getMonth()]};
let msg='';
async function cargar(){
  const hoy=new Date(),d0=iso(hoy),d1=new Date(hoy);d1.setDate(d1.getDate()+20);
  const r=tok?await rpc('hz_mi_turno',{p_token:tok,p_desde:d0,p_hasta:iso(d1)}):null;
  const A=$('#app');
  if(!r||r.code||!r.nombre){A.innerHTML='<div class="c"><h1>Enlace no válido</h1><p class="mu">Pide a tu jefe de cocina que te reenvíe tu enlace.</p></div>';return}
  const m={};r.turnos.forEach(t=>m[t.fecha]=t.codigo);
  let dias='';for(let i=0;i<21;i++){const d=new Date(hoy);d.setDate(d.getDate()+i);const k=iso(d),t=m[k]||'';
    dias+=`<div class="d ${i===0?'hoy':''}"><span>${i===0?'Hoy':DL[d.getDay()]+' '+d.getDate()+' '+ML[d.getMonth()]}</span><span class="t ${cls(t)}">${esc(t||'sin turno')}</span></div>`}
  const vac=r.vacaciones.length?r.vacaciones.map(v=>`<div class="d"><span>${esc(v.tipo)}</span><span>${fd(v.desde)} – ${fd(v.hasta)}</span></div>`).join(''):'<div class="mu">Sin vacaciones apuntadas.</div>';
  const pet=r.peticiones.length?r.peticiones.map(p=>`<div class="d"><span>${esc(p.tipo)} ${p.desde?fd(p.desde):''}${p.hasta&&p.hasta!==p.desde?' – '+fd(p.hasta):''}</span><span class="${p.estado==='aprobada'?'ok':p.estado==='rechazada'?'er':'mu'}">${esc(p.estado)}</span></div>`).join(''):'<div class="mu">No has pedido nada.</div>';
  A.innerHTML=`<h1>Hola, ${esc(r.nombre)}</h1><div class="mu">Tus turnos de las próximas 3 semanas</div>
  <div class="c">${dias}</div><div class="c"><h2>Vacaciones</h2>${vac}</div>
  <form class="c" id="f"><h2>Pedir algo al jefe</h2><div class="g"><label>Tipo<select id="tp"><option value="libre">Día libre</option><option value="cambio">Cambio de turno</option><option value="vacaciones">Vacaciones</option><option value="otro">Otro</option></select></label><span></span><label>Desde<input type="date" id="de" required></label><label>Hasta<input type="date" id="ha"></label></div><label style="margin:8px 0">Nota<textarea id="no" rows="2" maxlength="300"></textarea></label><button type="submit">Enviar petición</button><div class="mu" id="ms">${msg}</div></form>
  <div class="c"><h2>Mis peticiones</h2>${pet}</div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const de=$('#de').value,ha=$('#ha').value||de;
    const ok=await rpc('hz_pedir',{p_token:tok,p_tipo:$('#tp').value,p_desde:de,p_hasta:ha,p_nota:$('#no').value});
    msg=ok===true?'Enviada. Tu jefe la verá.':'No se pudo enviar (máximo 10 pendientes).';cargar()}
}
cargar();document.addEventListener('visibilitychange',()=>{if(!document.hidden)cargar()});
</script></body></html>
